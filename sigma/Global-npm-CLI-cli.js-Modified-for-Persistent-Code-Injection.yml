  - attack.t1554
logsource:
  category: file_event
detection:
  selection:
    TargetFilename|contains:
      - 'npm/lib/cli.js'
      - 'npm\lib\cli.js'
  condition: selection
falsepositives:
  - Legitimate npm version upgrade or reinstall overwriting cli.js
level: high
description: Detects unauthorized modifications to the core npm CLI entry point file
