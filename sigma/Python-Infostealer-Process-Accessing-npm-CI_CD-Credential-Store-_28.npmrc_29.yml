title: Python Infostealer Process Accessing npm CI/CD Credential Store
id: 5e2b7bc7-8375-47a7-88fc-04c8948b6b8c
author: detections.ai
date: '2026-07-30'
modified: '2026-07-30'
tags:
  - attack.t1195.002
  - attack.t1552
logsource:
  category: file_event
detection:
  selection_python:
    Image|endswith:
      - '\python3'
      - '\python3.exe'
      - '/python3'
  selection_npmrc:
    TargetFilename|contains: '.npmrc'
  selection_staging:
    TargetFilename|contains:
      - '\.npm\'
      - '/tmp/.npm'
  condition: selection_python and (selection_npmrc or selection_staging)
falsepositives:
  - Legitimate npm CLI operations that read or write .npmrc or the npm cache directory
  - Developer tooling that inspects npm configuration files
level: high
fields:
  - Image
  - TargetFilename
  - CommandLine
