title: Python Process Accessing Git Credential Files
id: 0bc3ac50-804e-4586-81fc-361663318e7c
author: detections.ai
date: '2026-07-30'
modified: '2026-07-30'
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  category: file_event
  product: windows
detection:
  selection_proc:
    Image|endswith:
      - '\python.exe'
      - '\python3.exe'
  selection_target:
    TargetFilename|endswith:
      - '\.git-credentials'
      - '\.netrc'
      - '\.gitconfig'
  condition: selection_proc and selection_target
falsepositives:
  - Legitimate Git tooling or credential managers reading these files
level: high
fields:
  - Image
  - TargetFilename
  - User
